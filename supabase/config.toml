project_id = "alys-pool-manager"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = false
[auth.email]
# Enable the email/password provider; global auth.enable_signup=false still blocks public signup.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "10MiB"
